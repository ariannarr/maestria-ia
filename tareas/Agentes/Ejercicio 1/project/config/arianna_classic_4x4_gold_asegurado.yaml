# Classic 4x4 Wumpus world from AIMA (Figure 7.2).
# (1, 1) is the bottom-left cave. The agent starts there, facing east.

#  4 | W  P  .  G 
#  3 | P  P  .  . 
#  2 | .  .  .  . 
#  1 | >  .  .  . 
#       1  2  3  4

grid:
  width: 4
  height: 4

agent:
  start: [1, 1]
  direction: east
  arrows: 1

wumpus: [1, 4]

pits:
  - [1, 3]
  - [2, 4]
  - [2, 3]

gold: [4, 2]

scoring:
  gold: 1000
  death: -1000
  step: -1
  shoot: -10

max_steps: 1
